[tool.poetry]
name = "fx-ai-quant-trading"
version = "0.1.0"
description = "A sophisticated algorithmic trading system for FX markets combining regime detection, ML forecasting, and optimal position sizing using the Kelly criterion"
authors = ["FX Trading Team <team@fxtrading.com>"]
readme = "README.md"
packages = [{include = "core"}, {include = "models"}, {include = "strategies"}, {include = "execution"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"

# Data Processing & Analysis
numpy = "^1.26.0"
pandas = "^2.0.0"
scipy = "^1.10.0"

# Machine Learning & Deep Learning
scikit-learn = "^1.3.0"
torch = "^2.0.0"
onnx = "^1.14.0"
onnxruntime = "^1.15.0"

# Financial Data & Analysis
yfinance = "^0.2.0"
ccxt = "^4.0.0"

# News & RSS feeds
feedparser = "^6.0.0"

# Messaging & Communication
pyzmq = "^25.0.0"
redis = "^4.5.0"
aioredis = "^2.0.0"

# API & Web Framework
fastapi = "^0.100.0"
uvicorn = "^0.22.0"
requests = "^2.31.0"
websockets = "^11.0.0"

# Performance & Optimization
cython = "^0.29.0"
ujson = "^5.7.0"
numba = "^0.58.0"

# Database & Storage
sqlalchemy = "^2.0.0"
psycopg2-binary = "^2.9.0"
pymongo = "^4.4.0"

# Monitoring & Logging
prometheus-client = "^0.17.0"
structlog = "^23.0.0"

# Configuration & Environment
python-dotenv = "^1.0.0"
pydantic = "^2.0.0"
pyyaml = "^6.0.0"

# Async & Concurrency
asyncio-throttle = "^1.0.0"
aiofiles = "^23.0.0"

# Mathematical & Statistical
statsmodels = "^0.14.0"
arch = "^5.3.0"
hmmlearn = "^0.3.0"

# Crypto & Security
cryptography = "^41.0.0"
bcrypt = "^4.0.0"

# Interactive Brokers & MT5
ib-insync = "^0.9.86"
aiohttp = "^3.12.0"
schedule = "^1.2.2"

[tool.poetry.group.dev.dependencies]
# Testing & Quality
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"
pytest-mock = "^3.11.0"
pytest-xdist = "^3.3.0"

# Code Quality & Formatting
black = "^23.0.0"
flake8 = "^6.0.0"
mypy = "^1.4.0"
isort = "^5.12.0"
pre-commit = "^3.3.0"

# Development & Documentation
jupyter = "^1.0.0"
ipywidgets = "^8.0.0"
matplotlib = "^3.7.0"
seaborn = "^0.12.0"
plotly = "^5.15.0"

# Type checking
types-requests = "^2.31.0"
types-redis = "^4.5.0"
types-pyyaml = "^6.0.0"
aioresponses = "^0.7.8"

[tool.poetry.group.analysis.dependencies]
# Additional analysis tools (optional)
jupyterlab = "^4.0.0"
notebook = "^7.0.0"
ipykernel = "^6.25.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["core", "models", "strategies", "execution"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "ccxt.*",
    "ib_insync.*",
    "hmmlearn.*",
    "arch.*"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "performance: marks tests as performance tests",
]

[tool.coverage.run]
source = ["core", "models", "strategies", "execution"]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/__pycache__/*",
    "main.py"
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
] 