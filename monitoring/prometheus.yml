# Prometheus Configuration for FX Quant Trading System
# This configuration file tells Prometheus how to scrape metrics from our trading system

global:
  scrape_interval: 15s        # How often to scrape targets
  evaluation_interval: 15s    # How often to evaluate rules
  external_labels:
    monitor: 'fx-trading-monitor'

# Rule files specifies a list of globs (currently empty)
rule_files:
  # - "alert_rules.yml"

# Scraping configuration
scrape_configs:
  # FX Trading System metrics
  - job_name: 'fx-ai-trading-system'
    static_configs:
      - targets: ['host.docker.internal:9000']
    
    # How often to scrape this target
    scrape_interval: 5s
    
    # Path to scrape metrics from
    metrics_path: /metrics
    
    # Additional labels to add to all metrics from this job
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: host.docker.internal:9000
    
    # Optional: Authentication if needed
    # basic_auth:
    #   username: 'monitoring'
    #   password: 'secret'

  # Optional: Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

# Optional: Alertmanager configuration
# alerting:
