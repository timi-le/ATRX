global:
  smtp_smarthost: "localhost:587"
  smtp_from: "fx-trading-alerts@company.com"

route:
  group_by: ["alertname"]
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: "web.hook"
  routes:
    - match:
        severity: critical
      receiver: "critical-alerts"
      group_wait: 5s
      repeat_interval: 5m
    - match:
        severity: warning
      receiver: "warning-alerts"
      repeat_interval: 30m

receivers:
  - name: "web.hook"
    webhook_configs:
      - url: "http://localhost:5001/alerts"
        send_resolved: true

  - name: "critical-alerts"
    webhook_configs:
      - url: "http://localhost:5001/critical"
        send_resolved: true
    slack_configs:
      - api_url: "https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK"
        channel: "#fx-trading-alerts"
        color: "danger"
        title: "CRITICAL: {{ .GroupLabels.alertname }}"
        text: "Component: {{ .GroupLabels.component }}"

  - name: "warning-alerts"
    webhook_configs:
      - url: "http://localhost:5001/warning"
        send_resolved: true
    slack_configs:
      - api_url: "https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK"
        channel: "#fx-trading-alerts"
        color: "warning"
        title: "WARNING: {{ .GroupLabels.alertname }}"
        text: "Component: {{ .GroupLabels.component }}"

inhibit_rules:
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname"]
